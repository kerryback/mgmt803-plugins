{% extends "base.html" %}
{% block content %}
<section class="card">
  <div class="card-head wrap">
    <span class="head-ic c-teal">{{ icon('wrench') }}</span>
    <h2>Home Upkeep</h2>
    <button class="btn soft sm" id="starter-btn" type="button">{{ icon('list') }} Starter list</button>
    <button class="btn primary sm" id="add-maint" type="button">{{ icon('plus') }} Upkeep job</button>
  </div>
  <div class="maint-stats" id="maint-stats"></div>
  <div id="maint-list"></div>
</section>
{% endblock %}
